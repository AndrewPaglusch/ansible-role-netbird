---
- name: Install NetBird (Debian)
  when: ansible_facts['os_family'] == 'Debian'
  block:
    - name: Install apt prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Add NetBird APT signing key
      ansible.builtin.get_url:
        url: https://pkgs.netbird.io/debian/public.key
        dest: /usr/share/keyrings/netbird-archive-keyring.asc
        mode: '0644'

    - name: Add NetBird APT repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.asc] https://pkgs.netbird.io/debian stable main"
        filename: netbird
        state: present
        update_cache: true

    - name: Install netbird package
      ansible.builtin.apt:
        name: netbird
        state: "{{ netbird_package_state }}"

- name: Install NetBird (RHEL)
  when: ansible_facts['os_family'] == 'RedHat'
  block:
    - name: Add NetBird YUM repository
      ansible.builtin.yum_repository:
        name: NetBird
        description: NetBird
        baseurl: https://pkgs.netbird.io/yum/
        enabled: true
        gpgcheck: true
        gpgkey: https://pkgs.netbird.io/yum/repodata/repomd.xml.key
        repo_gpgcheck: true
        file: netbird

    - name: Install netbird package
      ansible.builtin.dnf:
        name: netbird
        state: "{{ netbird_package_state }}"

- name: Ensure netbird service is enabled and running
  ansible.builtin.systemd:
    name: netbird
    state: started
    enabled: true

- name: Check netbird registration status
  ansible.builtin.command: netbird status
  register: netbird_status
  changed_when: false
  failed_when: false

- name: Track desired netbird flags
  ansible.builtin.copy:
    content: "{{ (netbird_management_url ~ ' ' ~ (netbird_extra_flags | join(' '))) | hash('sha256') }}"
    dest: /var/lib/netbird/.ansible-stamp
    mode: '0600'
  register: netbird_stamp

- name: Apply netbird config
  ansible.builtin.shell: >-
    netbird down 2>/dev/null;
    netbird up --setup-key {{ netbird_setup_key }}
    --management-url {{ netbird_management_url }}
    {{ netbird_extra_flags | join(' ') }}
  when: "netbird_stamp is changed or 'Management: Connected' not in netbird_status.stdout"
  no_log: true
